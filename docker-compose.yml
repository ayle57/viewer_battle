services:
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://viewerbattle:${POSTGRES_PASSWORD}@postgres:5432/viewerbattle
      HOST_PASSWORD: ${HOST_PASSWORD}
    volumes:
      # GeoGuessr map images the streamer uploads from Content Studio
      # (src/server/content/geoAssets.ts) are written straight to this
      # path — without a volume here they'd live only in the container's
      # own writable layer and vanish on the next `docker compose up
      # --build`/redeploy. A fresh volume starts EMPTY, which also means
      # the sample map baked into the image at build time (public/images/
      # maps/*, committed in the repo) won't appear here on first run —
      # accepted on purpose rather than adding an init-container copy
      # step for one demo file; the streamer uploads their own real maps
      # into this same path from then on.
      - geo_maps:/app/public/images/maps
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: viewerbattle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: viewerbattle
    volumes:
      # Postgres 18+ images refuse to start if the volume is mounted
      # directly on .../data (the old convention) — they now expect a
      # single mount on the parent directory, with data living in a
      # version-specific subdirectory underneath. Mounting on .../data
      # fails fast with a "pg_ctlcluster-compatible layout" error.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewerbattle"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  geo_maps:
